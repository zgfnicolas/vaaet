# ─────────────────────────────────────────────────────────────
# VAAET — Pipeline de Integración Continua
# Se activa en cada push y pull request a main.
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
    paths:
      - "vaaet-ml/**"
      - "vaaet-core/**"
      - "vaaet-persistence/**"
      - "vaaet-app/**"
      - "docs/**"
      - ".github/workflows/**"
      - ".codex/skills/**"
      - ".dvc/**"
      - ".dvcignore"
      - ".gitignore"
      - "AGENTS.md"
      - "llms.txt"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths:
      - "vaaet-ml/**"
      - "vaaet-core/**"
      - "vaaet-persistence/**"
      - "vaaet-app/**"
      - "docs/**"
      - ".github/workflows/**"
      - ".codex/skills/**"
      - ".dvc/**"
      - ".dvcignore"
      - ".gitignore"
      - "AGENTS.md"
      - "llms.txt"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "LICENSE"

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar espacios y marcadores de conflicto del cambio
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --check -r --root "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA...$HEAD_SHA"
          fi

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaaet-core
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar core y sus extras operativos
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[vision,inference,dev]"

      - name: Verificar dependencias e imports
        run: |
          python -m pip check
          python -c "import cv2, joblib, numpy, pandas, sklearn, tensorflow, ultralytics, vaaet"

      - name: Ejecutar Ruff
        run: ruff check src tests

      - name: Compilar módulos Python
        run: python -m compileall -q src tests

      - name: Ejecutar tests operativos y contractuales del core
        run: pytest -v --tb=short -x -m "not postgres"

  persistence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaaet-persistence
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar core y persistencia sin laboratorio ML
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "../vaaet-core"
          python -m pip install -e ".[admin,dev]"
      - name: Verificar independencia, tipado y pruebas
        run: |
          python -m pip check
          python -c "import vaaet, vaaet_persistence; assert vaaet_persistence.__version__ == '0.2.0'"
          ruff check src tests
          pyright src
          python -m compileall -q src tests
          pytest -v --tb=short -x -m "not postgres"

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaaet-ml
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar core, persistencia y laboratorio ML
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "../vaaet-core[vision,inference]"
          python -m pip install -e "../vaaet-persistence[admin]"
          python -m pip install -e ".[training,visualization,database,dev]"
      - name: Verificar imports separados
        run: |
          python -m pip check
          python -c "import vaaet, vaaet_persistence, vaaet_ml; import vaaet_ml.data.ingestion; import vaaet.inference"
      - name: Ejecutar Ruff
        run: ruff check src tests scripts migrations
      - name: Compilar módulos Python
        run: python -m compileall -q src tests scripts migrations
      - name: Ejecutar tests del laboratorio
        run: pytest -v --tb=short -x -m "not postgres"

      - name: Verificar compilación de notebooks
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for nb in pathlib.Path('notebooks').rglob('*.ipynb'):
              import json
              cells = json.loads(nb.read_text(encoding='utf-8'))['cells']
              for i, cell in enumerate(cells):
                  if cell['cell_type'] == 'code':
                      src = ''.join(cell['source'])
                      try:
                          ast.parse(src)
                      except SyntaxError as e:
                          errors.append(f'{nb}:cell {i}: {e}')
          if errors:
              print('\\n'.join(errors))
              sys.exit(1)
          print('✅ Todos los notebooks compilan correctamente')
          "

      - name: Detectar nombres no definidos entre celdas
        run: ruff check notebooks --select F821

      - name: Auditar estructura e higiene de notebooks
        run: python ../.codex/skills/vaaet-notebook-orchestration/scripts/audit_notebooks.py notebooks

      - name: Rechazar binarios ML versionados por Git
        run: |
          python -c "
          import pathlib, subprocess, sys
          forbidden = {'.pt', '.keras', '.joblib', '.h5'}
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          bad = [p for p in tracked if pathlib.Path(p).suffix.lower() in forbidden]
          print('Binarios ML versionados:', bad)
          sys.exit(bool(bad))
          "

  workspace-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar los tres componentes desde el workspace
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "vaaet-core"
          python -m pip install -e "vaaet-persistence"
          python -m pip install -e "vaaet-ml"
      - name: Verificar contratos de importación y DVC de raíz
        run: |
          python -m pip check
          python -c "import vaaet, vaaet_persistence, vaaet_ml; assert vaaet.__version__ == '0.2.1'; assert vaaet_persistence.__version__ == '0.2.0'; assert vaaet_ml.__version__ == '4.8.0'"
          test -d .dvc
          test -d vaaet-ml/artifacts/traffic-state

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar instalaciones mínimas aisladas
        run: |
          python -m venv "$RUNNER_TEMP/vaaet-core-base"
          "$RUNNER_TEMP/vaaet-core-base/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/vaaet-core-base/bin/python" -m pip install ./vaaet-core
          "$RUNNER_TEMP/vaaet-core-base/bin/python" -m pip check
          "$RUNNER_TEMP/vaaet-core-base/bin/python" -c "import vaaet; assert vaaet.__version__ == '0.2.1'"

          python -m venv "$RUNNER_TEMP/vaaet-persistence-base"
          "$RUNNER_TEMP/vaaet-persistence-base/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/vaaet-persistence-base/bin/python" -m pip install ./vaaet-core
          "$RUNNER_TEMP/vaaet-persistence-base/bin/python" -m pip install ./vaaet-persistence
          "$RUNNER_TEMP/vaaet-persistence-base/bin/python" -m pip check
          "$RUNNER_TEMP/vaaet-persistence-base/bin/python" -c "import vaaet_persistence; assert vaaet_persistence.__version__ == '0.2.0'"

          python -m venv "$RUNNER_TEMP/vaaet-workspace-base"
          "$RUNNER_TEMP/vaaet-workspace-base/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/vaaet-workspace-base/bin/python" -m pip install ./vaaet-core
          "$RUNNER_TEMP/vaaet-workspace-base/bin/python" -m pip install ./vaaet-persistence
          "$RUNNER_TEMP/vaaet-workspace-base/bin/python" -m pip install ./vaaet-ml
          "$RUNNER_TEMP/vaaet-workspace-base/bin/python" -m pip check
          "$RUNNER_TEMP/vaaet-workspace-base/bin/python" -c "import vaaet, vaaet_persistence, vaaet_ml; assert vaaet.__version__ == '0.2.1'; assert vaaet_persistence.__version__ == '0.2.0'; assert vaaet_ml.__version__ == '4.8.0'"

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar los tres componentes y extras para el análisis estático
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "vaaet-core[vision,inference,dev]"
          python -m pip install -e "vaaet-persistence[admin,dev]"
          python -m pip install -e "vaaet-ml[training,evaluation,database,visualization,dev]"
          python -m pip check
      - name: Verificar tipado estricto de código de producción
        run: pyright --project pyrightconfig.json --level error

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar enlaces internos en documentación
        run: |
          python -c "
          import pathlib, re, sys
          errors = []
          root = pathlib.Path('.')
          for md in root.rglob('*.md'):
              normalized = md.as_posix()
              if '.git' in normalized or 'plantillas_docs' in normalized:
                  continue
              content = md.read_text(encoding='utf-8', errors='replace')
              links = re.findall(r'\[.*?\]\((?!http)(.*?)\)', content)
              for link in links:
                  clean = link.split('#')[0].split('?')[0]
                  if not clean:
                      continue
                  target = (md.parent / clean).resolve()
                  if not target.exists():
                      errors.append(f'{md}: enlace roto → {clean}')
          if errors:
              print('Enlaces rotos encontrados:')
              print('\\n'.join(errors))
              sys.exit(1)
          print('✅ Todos los enlaces internos son válidos')
          "

  postgres-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaaet-ml
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vaaet
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vaaet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VAAET_DB_HOST: localhost
      VAAET_DB_PORT: "5432"
      VAAET_DB_NAME: vaaet
      VAAET_DB_SSLMODE: disable
      VAAET_ADMIN_DB_USER: postgres
      VAAET_ADMIN_DB_PASSWORD: postgres
      VAAET_COLLECTION_DB_USER: vaaet_collection_test
      VAAET_COLLECTION_DB_PASSWORD: collection-test-password
      VAAET_INFERENCE_DB_USER: vaaet_inference_test
      VAAET_INFERENCE_DB_PASSWORD: inference-test-password
      VAAET_TRAINING_DB_USER: vaaet_training_test
      VAAET_TRAINING_DB_PASSWORD: training-test-password
      VAAET_REVIEW_DB_USER: vaaet_review_test
      VAAET_REVIEW_DB_PASSWORD: review-test-password
      VAAET_EXPECT_LEGACY_FIXTURE: "1"
      VAAET_LEGACY_BACKUP_PATH: /tmp/vaaet-legacy.backup
      VAAET_MODERN_BACKUP_PATH: /tmp/vaaet-modern.backup
      VAAET_PG_RESTORE_PATH: /usr/lib/postgresql/17/bin/pg_restore
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: vaaet
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de base de datos
        run: |
          python -m pip install -e "../vaaet-core[inference]"
          python -m pip install -e "../vaaet-persistence[admin,dev]"
          python -m pip install -e ".[database,dev]"
          python -m pip check

      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --retry 3 --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Aplicar migración y roles
        run: |
          python -c "import pathlib, psycopg2; c=psycopg2.connect(); c.autocommit=True; c.cursor().execute(pathlib.Path('tests/fixtures/postgres-legacy.sql').read_text()); c.close()"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --data-only --table=public.traffic_data --file="$VAAET_LEGACY_BACKUP_PATH"
          alembic -c ../vaaet-persistence/alembic.ini upgrade 20260905_0003
          alembic -c ../vaaet-persistence/alembic.ini upgrade head
          /usr/lib/postgresql/17/bin/psql -v ON_ERROR_STOP=1 -f ../vaaet-persistence/src/vaaet_persistence/migrations/provision-roles.sql
          /usr/lib/postgresql/17/bin/psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE vaaet_collection_test LOGIN PASSWORD 'collection-test-password';
          CREATE ROLE vaaet_inference_test LOGIN PASSWORD 'inference-test-password';
          CREATE ROLE vaaet_training_test LOGIN PASSWORD 'training-test-password';
          CREATE ROLE vaaet_review_test LOGIN PASSWORD 'review-test-password';
          GRANT vaaet_collection_role TO vaaet_collection_test;
          GRANT vaaet_inference_role TO vaaet_inference_test;
          GRANT vaaet_training_role TO vaaet_training_test;
          GRANT vaaet_reviewer_role TO vaaet_review_test;
          SQL
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --data-only --table=vaaet_raw.traffic_data --file="$VAAET_MODERN_BACKUP_PATH"

      - name: Probar schema, constraints y mínimo privilegio
        run: pytest ../vaaet-persistence/tests/integration tests/integration -v --tb=short -m postgres

      - name: Auditar PostgreSQL sin mutaciones
        run: |
          vaaet-postgres-audit --output /tmp/postgres-audit.json
          python -c "import json; r=json.load(open('/tmp/postgres-audit.json')); assert r['alembic_revision']=='20260909_0004'; assert r['integrity']['automatic_accident_states']==0; assert r['integrity']['conflicting_validation_chains'] >= 0"

      - name: Probar migración desde base vacía
        run: |
          PGDATABASE=postgres python -c "import psycopg2; c=psycopg2.connect(); c.autocommit=True; c.cursor().execute('CREATE DATABASE vaaet_fresh'); c.close()"
          VAAET_DB_NAME=vaaet_fresh alembic -c ../vaaet-persistence/alembic.ini upgrade head
          PGDATABASE=vaaet_fresh /usr/lib/postgresql/17/bin/psql -v ON_ERROR_STOP=1 -f ../vaaet-persistence/src/vaaet_persistence/migrations/provision-roles.sql
          VAAET_EXPECT_LEGACY_FIXTURE=0 VAAET_DB_NAME=vaaet_fresh pytest ../vaaet-persistence/tests/integration tests/integration -v --tb=short -m postgres

  dvc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar componentes y plugins DVC declarados
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./vaaet-core"
          python -m pip install "./vaaet-persistence"
          python -m pip install "./vaaet-ml[dvc,dvc-gdrive,dvc-s3,dev]"
          python -m pip check

      - name: Verificar CLI y configuración DVC sin red
        run: |
          echo "=== DVC Version ==="
          dvc version
          dvc doctor
          echo "=== Status ==="
          dvc status
          vaaet-registry --help
          echo "✅ Configuración de DVC verificada"

      - name: Probar el registro DVC con adaptadores falsos
        run: pytest vaaet-ml/tests/unit/test_dvc_registry.py -v --tb=short
