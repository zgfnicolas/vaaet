[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaaet-core"
version = "0.2.1"
description = "VAAET Core — percepción e inferencia portables"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10,<3.14"
authors = [{name = "Facundo Nicolás González"}]
dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
vision = ["ultralytics-opencv-headless>=8.3,<9"]
inference = [
    "joblib>=1.4,<2",
    "scikit-learn>=1.5,<2",
    "tensorflow>=2.19,<2.21; python_version < '3.13'",
    "tensorflow>=2.20,<2.21; python_version >= '3.13'",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.12.0",
    "pyright>=1.1.400,<2",
    "pandas-stubs>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vaaet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "N", "A"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10
