[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaaet-ml"
version = "4.7.0"
description = "Video Advanced Analysis of Traffic — Sistema de análisis vehicular avanzado para el Puente Gral. Manuel Belgrano"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Facundo Nicolás González"},
]
keywords = ["traffic-analysis", "computer-vision", "yolo", "mlops", "colab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "vaaet-core==0.2.1",
    "vaaet-persistence==0.1.0",
]

[project.optional-dependencies]
vision = [
    "vaaet-core[vision]==0.2.1",
]
training = [
    "vaaet-core[inference]==0.2.1",
    "imbalanced-learn>=0.13,<1",
]
evaluation = [
    "vaaet-core[inference]==0.2.1",
]
database = [
    "vaaet-persistence==0.1.0",
]
visualization = [
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "ipywidgets>=8.1,<9",
]
dev = [
    "vaaet-persistence[admin]==0.1.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.12.0",
    "pyright>=1.1.400,<2",
    "pandas-stubs>=2.2,<3",
]
dvc = [
    "dvc>=3.50.0",
]
dvc-gdrive = [
    "dvc-gdrive>=3.0.0",
]
dvc-s3 = [
    "dvc-s3>=3.0.0",
]

[project.scripts]
vaaet-registry = "vaaet_ml.dvc_registry.cli:main"

[project.urls]
Repository = "https://github.com/zgfnicolas/vaaet"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vaaet_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "postgres: requires a live PostgreSQL integration database",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "N", "A"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.setuptools.package-data]
"*" = ["*.md"]
