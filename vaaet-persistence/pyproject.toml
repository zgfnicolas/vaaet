[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaaet-persistence"
version = "0.1.0"
description = "Shared PostgreSQL persistence for VAAET workflows and services"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Facundo Nicolás González"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "vaaet-core==0.2.1",
    "pandas>=2.2,<3",
    "sqlalchemy>=2,<3",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
admin = [
    "alembic>=1.14,<2",
]
dev = [
    "alembic>=1.14,<2",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.12.0",
    "pyright>=1.1.400,<2",
    "pandas-stubs>=2.2,<3",
]

[project.scripts]
vaaet-postgres-audit = "vaaet_persistence.audit:main"

[project.urls]
Repository = "https://github.com/zgfnicolas/vaaet"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vaaet_persistence*"]

[tool.setuptools.package-data]
vaaet_persistence = [
    "migrations/*.mako",
    "migrations/*.sql",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "postgres: requires a live PostgreSQL integration database",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "N", "A"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10
